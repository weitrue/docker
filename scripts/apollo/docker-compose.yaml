version: '2.2'
services:
  apollo:
    image: idoop/docker-apollo:latest
    container_name: apollo
    network_mode: "bridge"
    ports:
      - "8070:8070"
      - "8080:8080"
      - "8090:8090"
    restart: always
    volumes:
      - ./logs:/opt
      # - ./application-ldap.yml:/apollo-portal/config/application-ldap.yml:ro # ldap配置文件挂载路径

    # 启动前，确认对应环境的数据库已经建立，否则apollo无法启动，使用官方sql文件即可创建：
    # portal：https://raw.githubusercontent.com/ctripcorp/apollo/master/scripts/sql/apolloconfigdb.sql
    # config：https://raw.githubusercontent.com/ctripcorp/apollo/master/scripts/sql/apolloportaldb.sql
    # 默认端口：portal:8070；dev:8080,8090；fat:8081,8091；uat:8082,8092；pro:8083,8093
    environment:
      # 注意 Portal Database 的 Name，本处使用官方默认名
      PORTAL_DB: jdbc:mysql://host.docker.internal:3306/ApolloPortalDB?characterEncoding=utf8
      PORTAL_DB_USER: root
      PORTAL_DB_PWD: "123123"
      PORTAL_PORT: 8070
      # PORTAL_LDAP: "TRUE" # LDAP 认证

      # 注意 Config Database 的 Name，本处使用官方默认名
      DEV_DB: jdbc:mysql://host.docker.internal:3306/ApolloConfigDB?characterEncoding=utf8
      DEV_DB_USER: root
      DEV_DB_PWD: "123123"
      DEV_CONFIG_PORT: 8080
      DEV_ADMIN_PORT: 8090

      # FAT_DB: jdbc:mysql://10.0.0.8:3306/ApolloConfigDBFat?characterEncoding=utf8
      # FAT_DB_USER: root
      # FAT_DB_PWD: password
      # FAT_CONFIG_PORT: 8081
      # FAT_ADMIN_PORT: 8091

      # UAT_DB: jdbc:mysql://10.0.0.8:3306/ApolloConfigDBUat?characterEncoding=utf8
      # UAT_DB_USER: root
      # UAT_DB_PWD: password
      # UAT_CONFIG_PORT: 8082
      # UAT_ADMIN_PORT: 8092

      # PRO_DB: jdbc:mysql://10.0.0.8:3306/ApolloConfigDBPro?characterEncoding=utf8
      # PRO_DB_USER: root
      # PRO_DB_PWD: password
      # PRO_CONFIG_PORT: 8083
      # PRO_ADMIN_PORT: 8093
